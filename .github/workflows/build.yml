name: Java CI with Gradle & Codecov & EB Deploy

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run tests with coverage and build
        run: |
          ./gradlew clean testCoverage build \
            -DMONGO_HOST=${{ secrets.MONGO_HOST }} \
            -DMONGO_PORT=${{ secrets.MONGO_PORT }} \
            -DMONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_INITDB_ROOT_USERNAME }} \
            -DMONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_INITDB_ROOT_PASSWORD }} \
            -DMYSQL_URL=${{ secrets.MYSQL_URL }} \
            -DMYSQL_USERNAME=${{ secrets.MYSQL_USERNAME }} \
            -DMYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
            -DREDIS_HOST=${{ secrets.REDIS_HOST }} \
            -DREDIS_PORT=${{ secrets.REDIS_PORT }} \
            -DREDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }} \
            -DJWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} \
            -DPAYMENT_CLIENT_KEY=${{ secrets.PAYMENT_CLIENT_KEY }} \
            -DPAYMENT_SECRET_KEY=${{ secrets.PAYMENT_SECRET_KEY }} \
            -DAWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }} \
            -DAWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }} \
            -DAWS_REGION=${{ secrets.AWS_REGION }} \
            -DAWS_BUCKET=${{ secrets.AWS_BUCKET }} \
            -DAWS_CLOUDFRONT_DOMAIN=${{ secrets.AWS_CLOUDFRONT_DOMAIN }} \
            -DELASTICSEARCH_URIS=${{ secrets.ELASTICSEARCH_URIS }}

      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/

      - name: Upload placeholder resolution error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: placeholder-errors
          path: build/reports/problems/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true

      - name: Create EB package with Dockerfile.api
        run: |
          mkdir eb-build
          cp Dockerfile.api eb-build/Dockerfile
          cp build/libs/palayo-0.0.1-SNAPSHOT.jar eb-build/app.jar
          cd eb-build
          zip -r ../deploy.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_JUN_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_EB_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload to S3
        run: aws s3 cp deploy.zip s3://${{ secrets.S3_BUCKET_NAME }}/deploy.zip

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ secrets.EB_APPLICATION_NAME }} \
            --version-label github-${{ github.sha }} \
            --source-bundle S3Bucket=${{ secrets.S3_BUCKET_NAME }},S3Key=deploy.zip

          aws elasticbeanstalk update-environment \
            --environment-name ${{ secrets.EB_ENVIRONMENT_NAME }} \
            --version-label github-${{ github.sha }}
