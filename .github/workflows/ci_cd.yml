name: Java CI/CD with Docker & EC2

on:
  pull_request:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Grant execute permission
      - name: Grant permission for Gradle
        run: chmod +x gradlew

      # 4. Build Spring app
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 5. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Build Docker image
      - name: Build Docker image
        run: docker build -f Dockerfile-app -t ${{ secrets.DOCKER_USERNAME }}/spring-app:latest .

      # 7. Push Docker image
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/spring-app:latest

      # 8. Decoding firebase json and save to EC2
      - name: Deploy Firebase Key
        run: |
          mkdir -p ~/firebase
          echo "$FIREBASE_ACCOUNT_KEY" | base64 -d > ~/firebase/service_account_key.json
        env:
          FIREBASE_ACCOUNT_KEY: ${{ secrets.FIREBASE_ACCOUNT_KEY }}

      # 9. CD
      - name: Connect to EC2 and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Generating .env file..."
            cat <<EOF > ~/.env
            AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
            AWS_BUCKET=${{ secrets.AWS_BUCKET }}
            AWS_CLOUDFRONT_DOMAIN=${{ secrets.AWS_CLOUDFRONT_DOMAIN }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
            ELASTICSEARCH_HOST=${{ secrets.ELASTICSEARCH_HOST }}
            ELASTICSEARCH_URIS=${{ secrets.ELASTICSEARCH_URIS }}
            ES_HTTPS_PORT=${{ secrets.ES_HTTPS_PORT }}
            ES_TCP_PORT=${{ secrets.ES_TCP_PORT }}
            KIBANA_PORT=${{ secrets.KIBANA_PORT }}
            SPRING_PORT=${{ secrets.SPRING_PORT }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
            MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
            MONGO_HOST=${{ secrets.MONGO_HOST }}
            MONGO_PORT=${{ secrets.MONGO_PORT }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            MYSQL_URL=${{ secrets.MYSQL_URL }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            MYSQL_USERNAME=${{ secrets.MYSQL_USERNAME }}
            PAYMENT_CLIENT_KEY=${{ secrets.PAYMENT_CLIENT_KEY }}
            PAYMENT_SECRET_KEY=${{ secrets.PAYMENT_SECRET_KEY }}
            FIREBASE_CONFIG_PATH=/app/src/main/resources/firebase/service_account_key.json
            EOF

            chmod +x ~/deploy.sh
            ~/deploy.sh

      - name: Debug base64 decoding process
        run: |
          echo "${FIREBASE_ACCOUNT_KEY}" | tr -d '\n' | base64 -d > decoded_service_account_key.json
          ls -l decoded_service_account_key.json
          if [ -s decoded_service_account_key.json ]; then
            echo "File exists and is not empty."
            cat decoded_service_account_key.json
          else
            echo "Decoded file is empty!"
          fi
      
