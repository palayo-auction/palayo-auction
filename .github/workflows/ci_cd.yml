name: Java CI/CD with Docker & EC2

on:
  pull_request:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Grant execute permission
      - name: Grant permission for Gradle
        run: chmod +x gradlew

      # 4. Set up envs
      - name: Create .env and Firebase key
        run: echo "${{ secrets.FIREBASE_ACCOUNT_KEY }}" > firebase-service-account.json

      # 5. Build Spring app
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 6. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Build Docker image
      - name: Build Docker image
        run: docker build -f Dockerfile-app -t ${{ secrets.DOCKER_USERNAME }}/spring-app:latest .

      # 8. Push Docker image
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/spring-app:latest

      # 9. CD
      - name: Connect to EC2 and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            chmod +x ~/deploy.sh
            ~/deploy.sh
