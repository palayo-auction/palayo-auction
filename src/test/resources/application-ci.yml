spring:
  application:
    name: palayo
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:palayo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
      show_sql: true
      format_sql: true
      use_sql_comments: true
  elasticsearch:
    uris: "http://localhost:9200"
  cloud:
    aws:
      credentials:
        access-key: dummy
        secret-key: dummy
      region:
        static: ap-northeast-2
      s3:
        bucket: dummy-bucket
  firebase:
    config-path: classpath:fake-firebase.json
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB
  data:
    redis:
      port: 6379
      host: localhost

payment:
  client-key: test_fake_keys
  secret-key: test_fake_keys
  success_url: "http://localhost:8080/test_fake_success"
  fail_url: "http://localhost:8080/test_fake_fail"

custom:
  cloudfront:
    domain: https://test_fake.net
  redis:
    host: localhost
    port: 6379
