spring:
  application:
    name: palayo
    admin:
      enabled: false

  jmx:
    enabled: false

  main:
    log-startup-info: true
    lazy-initialization: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ${AWS_REGION}
      s3:
        bucket: ${AWS_BUCKET}

  data:
    mongodb:
      host: ${MONGO_HOST}
      port: ${MONGO_PORT}
      username: ${MONGO_INITDB_ROOT_USERNAME}
      password: ${MONGO_INITDB_ROOT_PASSWORD}
      authentication-database: admin
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
        format_sql: true
        use_sql_comments: true

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}

jwt:
  secret:
    key: ${JWT_SECRET_KEY}

payment:
  client-key: ${PAYMENT_CLIENT_KEY}
  secret-key: ${PAYMENT_SECRET_KEY}
  success_url: "http://localhost:8080/api/v1/payments/success"
  fail_url: "http://localhost:8080/api/v1/payments/fail"

custom:
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
