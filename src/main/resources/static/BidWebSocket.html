<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<h1>WebSocket Test</h1>

<input type="number" id="auctionIdInput" placeholder="Auction ID" />
<input type="number" id="bidPriceInput" placeholder="Bid Price" />
<button id="connectButton">Connect</button>
<button id="sendBidButton">Send Bid</button>

<script>
    let stompClient = null;

    function getTokenFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('token');
    }

    document.getElementById("connectButton").onclick = function() {
        const token = getTokenFromUrl();
        if (token) {
            const socket = new SockJS('http://localhost:8080/ws-bid?token=' + token);
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function(frame) {
                console.log('Connected: ' + frame);

                stompClient.subscribe('/user/queue/errors', function(errorMessage) {
                    const error = JSON.parse(errorMessage.body);
                    console.error("입찰 실패:");
                    console.error("코드:", error.errorCode);
                    console.error("메시지:", error.message);
                });

            }, function(error) {
                console.error('STOMP error: ' + error);
            });
        } else {
            console.error('Token is missing in the URL.');
        }
    };

    document.getElementById("sendBidButton").onclick = function() {
        if (stompClient) {
            const auctionId = document.getElementById("auctionIdInput").value;
            const bidPrice = document.getElementById("bidPriceInput").value;

            if (!auctionId || !bidPrice) {
                alert("경매 ID와 입찰 금액을 모두 입력해주세요.");
                return;
            }

            const topic = `/topic/bids.${auctionId}`;
            stompClient.subscribe(topic, function(messageOutput) {
                console.log(`응답 도착 from ${topic}`);
                console.log("Received: ", JSON.parse(messageOutput.body));
            });

            const bidMessage = {
                auctionId: parseInt(auctionId),
                bidPrice: parseInt(bidPrice)
            };

            stompClient.send("/app/bid.send", {}, JSON.stringify(bidMessage));
            console.log("Sent bid:", bidMessage);
        }
    };
</script>
</body>
</html>
