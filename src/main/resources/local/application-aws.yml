spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB
  cloud:
    aws:
      credentials:
        access-key: "${AWS_ACCESS_KEY}"
        secret-key: "${AWS_SECRET_KEY}"
      region:
        static: "${AWS_IMAGE_REGION}"
      s3:
        bucket: "${AWS_IMAGE_BUCKET}"
custom:
  cloudfront:
    domain: "${AWS_IMAGE_CLOUDFRONT_DOMAIN}"