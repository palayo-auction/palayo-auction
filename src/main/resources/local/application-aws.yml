spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB
  cloud:
    aws:
      credentials:
        access-Key: ${AWS_ACCESS_KEY}
        secret-Key: "${AWS_SECRET_KEY}"
      region:
        static: "${AWS_REGION}"
      s3:
        bucket: ${AWS_BUCKET}
custom:
  cloudfront:
    domain: "${AWS_CLOUDFRONT_DOMAIN}"